name: Publish container image

'on':
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wangjiancn/personal-blog-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          build-args: |
            version=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/wangjiancn/back-end_blog
            org.opencontainers.image.revision=${{ github.sha }}
            com.my-ops.source-revision=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Record immutable reference
        run: |
          printf "### Published image\n\n\`%s/%s@%s\`\n" \
            "$REGISTRY" "$IMAGE_NAME" "${{ steps.push.outputs.digest }}" \
            >> "$GITHUB_STEP_SUMMARY"
